services:
  dimension:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Required: keeps image URLs valid across restarts (any long random string).
      STORAGE_SECRET: "change-me-to-a-long-random-string"
      # Optional: the public origin used in signed image URLs. Set it to the
      # address people actually visit, e.g. https://dimension.example.com.
      # PUBLIC_ORIGIN: "https://dimension.example.com"
    volumes:
      - dimension-data:/data
    restart: unless-stopped

volumes:
  dimension-data:
