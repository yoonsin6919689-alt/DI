services:
  dimension:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Required: keeps image URLs valid across restarts. Set it in .env.
      STORAGE_SECRET: "${STORAGE_SECRET:-change-me-to-a-long-random-string}"
      # Optional: the public origin used in signed image URLs, e.g.
      # http://1.2.3.4 or https://dimension.example.com.
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
    volumes:
      - dimension-data:/data
    restart: unless-stopped

volumes:
  dimension-data:
