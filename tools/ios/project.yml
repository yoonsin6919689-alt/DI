name: DIMENSION
options:
  bundleIdPrefix: kr.dimension
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DIMENSION:
    type: application
    platform: iOS
    sources:
      - path: DIMENSION
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.dimension.app
        PRODUCT_NAME: DIMENSION
        INFOPLIST_FILE: DIMENSION/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
schemes:
  DIMENSION:
    build:
      targets:
        DIMENSION: all
    run:
      config: Debug
    archive:
      config: Release
